<script data-purpose="interaction-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-input');
      const initialState = document.getElementById('initial-empty-state');
      const resultsState = document.getElementById('search-results-state');
      const viewAllLink = document.getElementById('view-all-link');
      const btnBack = document.getElementById('btn-back');
      const btnClose = document.getElementById('btn-close');

      // Function to switch to 'results' view
      const activateSearch = () => {
        // Hide initial state immediately
        initialState.classList.add('hidden-state');
        
        if(viewAllLink) viewAllLink.style.display = 'none';
        
        // Show results state
        resultsState.classList.add('active');
      };

      // Function to reset to 'initial' view
      const resetSearch = () => {
        searchInput.value = ''; // Clear input
        
        // Hide results
        resultsState.classList.remove('active');
        
        if(viewAllLink) viewAllLink.style.display = 'block';
        
        // Wait slightly for results to fade before showing initial state
        setTimeout(() => {
          initialState.classList.remove('hidden-state');
        }, 150);
      };

      // Event Listeners
      searchInput.addEventListener('focus', activateSearch);
      
      if(viewAllLink) {
          viewAllLink.addEventListener('click', (e) => { 
              e.preventDefault(); 
              activateSearch(); 
          });
      }
      
      // Buttons reset the state for this demo
      btnBack.addEventListener('click', resetSearch);
      btnClose.addEventListener('click', resetSearch);
    });
  </script>
