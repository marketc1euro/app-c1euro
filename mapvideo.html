<style data-purpose="custom-animations">
    /* Prevent scrolling on the body */
    body {
      overflow: hidden;
    }

    .leaflet-container {
        background-color: #faf8ff !important;
    }

    /* Initial states */
    #search-results-state {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.3s ease-out;
      display: none; /* Hidden initially */
    }

    #search-results-state.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      display: flex;
    }

    #initial-empty-state {
      transition: all 0.3s ease-out;
      opacity: 1;
      transform: translateY(0);
    }
    
    #initial-empty-state.hidden-state {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }
    
    #search-container {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes icon-pulse-ripple {
      0% { box-shadow: 0 0 0 0 rgba(124, 124, 255, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(124, 124, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(124, 124, 255, 0); }
    }
    
    .animate-pulse-ripple {
      animation: icon-pulse-ripple 2s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(186, 26, 26, 0); }
      100% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0); }
    }
    
    .animate-pulse-red {
      animation: pulse-red 2s infinite;
    }

    @keyframes intense-pulse {
      0% { box-shadow: 0 0 0 0 rgba(231, 127, 103, 0.7), 0 0 0 0 rgba(231, 127, 103, 0.5); }
      50% { box-shadow: 0 0 0 10px rgba(231, 127, 103, 0.1), 0 0 0 20px rgba(231, 127, 103, 0.1); }
      100% { box-shadow: 0 0 0 0 rgba(231, 127, 103, 0), 0 0 0 0 rgba(231, 127, 103, 0); }
    }

    .animate-intense-pulse {
      animation: intense-pulse 1.5s infinite;
    }

    .scroll-indicator-bar {
      transition: all 0.3s ease;
    }
    .scroll-indicator-bar.active {
      background-color: #000000;
      opacity: 1;
      transform: scaleY(1.2);
    }
    
    /* Smooth scrolling for carousels */
    .carousel-container {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* Bottom Panel Expansion Styles */
    #bottom-panel {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
      height: 80px;
    }
    #bottom-panel.youtube-active, #bottom-panel.campaign-active {
      height: 220px;
      background-color: var(--c-white, white);
    }
    #categories-carousel {
      transition: opacity 0.3s ease-in-out;
    }
    #bottom-panel.expanded #categories-carousel {
      opacity: 1;
      pointer-events: auto;
      transition-delay: 0.15s;
    }

    /* Control Capsule Styles */
    #control-capsule {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      bottom: 106px;
    }
    #control-capsule.expanded {
      bottom: 272px;
    }
    #control-capsule.youtube-active, #control-capsule.campaign-active {
      bottom: 246px;
    }

    .content-fade {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .content-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      position: absolute;
    }
    
    /* Story Overlay Styles */
    #story-overlay {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
      transition: all 0.3s ease;
    }
    #story-overlay.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Thumbnail Play Button Overlay */
    .play-button-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-center;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .play-button-overlay:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background-color: rgba(255, 255, 255, 0.9);
    }
    .play-icon {
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 20px solid black;

<script data-purpose="interaction-logic">
    function playVideo() {
      const thumbnailView = document.getElementById('thumbnail-view');
      const iframeView = document.getElementById('iframe-view');
      
      // Inject iframe
      iframeView.innerHTML = `<iframe class="w-full h-full border-0" src="https://www.youtube.com/embed/I2L7ZwLyWZg?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&playsinline=1&loop=1&playlist=I2L7ZwLyWZg" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen="" frameborder="0"></iframe>`;
      
      // Toggle visibility
      thumbnailView.classList.add('hidden');
      iframeView.classList.remove('hidden');
    }

    function resetVideo() {
      const thumbnailView = document.getElementById('thumbnail-view');
      const iframeView = document.getElementById('iframe-view');
      
      // Remove iframe to stop playback
      iframeView.innerHTML = '';
      
      // Reset visibility
      iframeView.classList.add('hidden');
      thumbnailView.classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-input');
      const initialState = document.getElementById('initial-empty-state');
      const resultsState = document.getElementById('search-results-state');
      const viewAllLink = document.getElementById('view-all-link');
      const btnBack = document.getElementById('btn-back');
      const btnClose = document.getElementById('btn-close');
      const megaphoneBtn = document.getElementById('megaphone-btn');
      const youtubeBtn = document.getElementById('youtube-btn');
      const bottomPanel = document.getElementById('bottom-panel');
      const original = document.getElementById('original-bottom-content');
      const youtube = document.getElementById('youtube-deposit-content');
      const campaign = document.getElementById('campaign-content');
      const capsule = document.getElementById('control-capsule');
      const storyOverlay = document.getElementById('story-overlay');
      const storyCloseBtn = document.getElementById('story-close-btn');

      // Story overlay close logic
      if (storyCloseBtn && storyOverlay) {
        storyCloseBtn.addEventListener('click', () => {
          storyOverlay.classList.remove('active');
          resetVideo();
        });
      }

      // YouTube button logic
      if(youtubeBtn) {
        youtubeBtn.addEventListener('click', () => {
          const isActive = bottomPanel.classList.contains('youtube-active');
          const icon = youtubeBtn.querySelector('span');
          
          if (isActive) {
            bottomPanel.classList.remove('youtube-active');
            capsule.classList.remove('youtube-active');
            original.classList.remove('content-hidden');
            youtube.classList.add('content-hidden');
            youtubeBtn.className = 'w-[38px] h-[38px] rounded-full bg-white text-on-surface flex items-center justify-center hover:bg-surface-container-low transition-all shadow-sm border border-surface-container-highest';
            youtubeBtn.style.backgroundColor = '';
            icon.textContent = 'add';
            icon.style.transform = 'rotate(0deg)';
            icon.className = 'material-symbols-outlined text-lg transition-transform duration-300';
          } else {
            // Close campaign if open
            bottomPanel.classList.remove('campaign-active');
            capsule.classList.remove('campaign-active');
            campaign.classList.add('content-hidden');
            if(megaphoneBtn) {
                const megaIcon = megaphoneBtn.querySelector('span');
                megaIcon.textContent = 'campaign';
                megaIcon.style.transform = 'rotate(0deg)';
                megaphoneBtn.style.backgroundColor = '#40407a';
            }
            
            bottomPanel.classList.add('youtube-active');
            capsule.classList.add('youtube-active');
            original.classList.add('content-hidden');
            youtube.classList.remove('content-hidden');
            youtubeBtn.className = 'w-[38px] h-[38px] rounded-full text-white flex items-center justify-center hover:opacity-90 transition-all shadow-sm animate-intense-pulse';
            youtubeBtn.style.backgroundColor = '#e77f67';
            icon.textContent = 'close';
            icon.style.transform = 'rotate(90deg)';
            icon.className = 'material-symbols-outlined text-lg text-white transition-transform duration-300';
          }
        });
      }

      // Megaphone button logic
      if(megaphoneBtn) {
        megaphoneBtn.addEventListener('click', () => {
          const isActive = bottomPanel.classList.contains('campaign-active');
          const icon = megaphoneBtn.querySelector('span');
          
          if (isActive) {
            bottomPanel.classList.remove('campaign-active');
            capsule.classList.remove('campaign-active');
            original.classList.remove('content-hidden');
            campaign.classList.add('content-hidden');
            icon.textContent = 'campaign';
            icon.style.transform = 'rotate(0deg)';
            megaphoneBtn.style.backgroundColor = '#40407a';
          } else {
            // Close youtube if open
            bottomPanel.classList.remove('youtube-active');
            capsule.classList.remove('youtube-active');
            youtube.classList.add('content-hidden');
            if(youtubeBtn) {
                const ytIcon = youtubeBtn.querySelector('span');
                youtubeBtn.className = 'w-[38px] h-[38px] rounded-full bg-white text-on-surface flex items-center justify-center hover:bg-surface-container-low transition-all shadow-sm border border-surface-container-highest';
                youtubeBtn.style.backgroundColor = '';
                ytIcon.textContent = 'add';
                ytIcon.style.transform = 'rotate(0deg)';
                ytIcon.className = 'material-symbols-outlined text-lg transition-transform duration-300';
            }
            
            bottomPanel.classList.add('campaign-active');
            capsule.classList.add('campaign-active');
            original.classList.add('content-hidden');
            campaign.classList.remove('content-hidden');
            icon.textContent = 'close';
            icon.style.transform = 'rotate(90deg)';
            megaphoneBtn.style.backgroundColor = '#e77f67';
          }
        });
      }

      // Scroll logic for indicators
      const scrollableList = document.getElementById('scrollable-service-list');
      const indicatorBars = document.querySelectorAll('.scroll-indicator-bar');
      
      if(scrollableList && indicatorBars.length > 0) {
        scrollableList.addEventListener('scroll', () => {
          const scrollPercent = scrollableList.scrollTop / (scrollableList.scrollHeight - scrollableList.clientHeight);
          const activeIndex = Math.min(
            indicatorBars.length - 1, 
            Math.max(0, Math.floor(scrollPercent * indicatorBars.length))
          );
          
          indicatorBars.forEach((bar, index) => {
            if(index === activeIndex) {
              bar.classList.add('active', 'opacity-100');
              bar.classList.remove('opacity-40');
            } else {
              bar.classList.remove('active', 'opacity-100');
              bar.classList.add('opacity-40');
            }
          });
        });
      }

      // Function to switch to 'results' view
      const activateSearch = () => {
        if(initialState) initialState.classList.add('hidden-state');
        if(resultsState) resultsState.classList.add('active');
      };

      // Function to reset to 'initial' view
      const resetSearch = () => {
        if(searchInput) searchInput.value = ''; // Clear input
        if(resultsState) resultsState.classList.remove('active');
        
        // Wait slightly for results to fade before showing initial state
        setTimeout(() => {
          if(initialState) initialState.classList.remove('hidden-state');
        }, 150);
      };

      // Event Listeners
      if(searchInput) searchInput.addEventListener('focus', activateSearch);
      if(btnBack) btnBack.addEventListener('click', resetSearch);
      if(btnClose) btnClose.addEventListener('click', resetSearch);
    });
  </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const carousels = document.querySelectorAll('.overflow-x-auto.snap-x');

  carousels.forEach(carousel => {
    let isDown = false;
    let startX;
    let scrollLeft;
    let isScrolling;

    // Use native smooth scrolling and snapping by default for better performance
    // The following JS is to allow mouse dragging which is not natively supported

    carousel.addEventListener('mousedown', (e) => {
      isDown = true;
      // Temporarily disable smooth scroll and snap for immediate drag response
      carousel.style.scrollBehavior = 'auto';
      carousel.classList.remove('snap-mandatory'); 
      startX = e.pageX - carousel.offsetLeft;
      scrollLeft = carousel.scrollLeft;
      carousel.style.cursor = 'grabbing';
      carousel.style.userSelect = 'none';
    });

    const endDrag = () => {
      if (!isDown) return;
      isDown = false;
      carousel.style.cursor = 'grab';
      carousel.style.userSelect = '';
      
      // Re-enable smooth scroll and snapping after a short delay
      // to let the momentum settle if any, then snap to nearest
      setTimeout(() => {
        carousel.style.scrollBehavior = 'smooth';
        carousel.classList.add('snap-mandatory');
      }, 50);
    };

    carousel.addEventListener('mouseleave', endDrag);
    carousel.addEventListener('mouseup', endDrag);

    carousel.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - carousel.offsetLeft;
      // Adjust drag speed here if needed
      const walk = (x - startX) * 1.5; 
      carousel.scrollLeft = scrollLeft - walk;
    });

    // We can rely on native wheel scrolling, but if we want horizontal scrolling with vertical wheel:
    carousel.addEventListener('wheel', (e) => {
      // Only hijack vertical scrolls to translate to horizontal if needed,
      // but native touchpads usually handle horizontal well.
      // If we do hijack, ensure smooth behavior.
      if (e.deltaY !== 0 && e.deltaX === 0) {
        e.preventDefault();
        carousel.scrollBy({
          left: e.deltaY < 0 ? -300 : 300, // Adjusted scroll amount
          behavior: 'smooth'
        });
      }
    }, { passive: false });

    // Initial cursor style
    carousel.style.cursor = 'grab';
  });
});
</script>

<script data-purpose="carte-etat-ouverture">
  (function () {
    function auChargement() {
      /* 1) on ouvre sur la carte, jamais sur la video */
      var overlay = document.getElementById('story-overlay');
      if (overlay) overlay.classList.remove('active');
      var iframe = document.getElementById('iframe-view');
      if (iframe) iframe.innerHTML = '';
      var vignette = document.getElementById('thumbnail-view');
      if (vignette) vignette.classList.remove('hidden');

      /* 2) barre du bas : etat d'origine, celui qui montre la recherche */
      var panneau = document.getElementById('bottom-panel');
      var capsule = document.getElementById('control-capsule');
      var original = document.getElementById('original-bottom-content');
      var youtube = document.getElementById('youtube-deposit-content');
      var campagne = document.getElementById('campaign-content');
      var fiche = document.getElementById('product-summary-content');
      [panneau, capsule].forEach(function (e) {
        if (e) e.classList.remove('product-active', 'campaign-active', 'youtube-active');
      });
      if (original) original.classList.remove('content-hidden');
      [youtube, campagne, fiche].forEach(function (e) { if (e) e.classList.add('content-hidden'); });
    }

    /* 3) clic sur un rond produit : la story prend l'image du produit clique.
       L'ouverture elle-meme est deja geree par la page (ajout de la classe
       « active » sur la story). */
    document.addEventListener('click', function (e) {
      /* on remonte les parents jusqu'a trouver une vignette ronde de produit :
         peu importe la structure du marqueur, l'ouverture marchera pareil */
      /* uniquement un marqueur de la carte : un clic ailleurs (dans le vide,
         sur la carte, sur une pastille de prix) ne fait rien */
      var marqueur = e.target && e.target.closest
        ? e.target.closest('.leaflet-marker-icon, .custom-div-icon') : null;
      if (!marqueur) return;
      var image = marqueur.querySelector('img');
      if (!image) return;                       /* pastille de prix : on ne touche pas */
      var vignette = document.querySelector('#thumbnail-view img');
      if (vignette) vignette.src = image.src;
      /* on ouvre la story nous-memes : tous les ronds n'ont pas de gestionnaire,
         et l'ouverture doit marcher partout de la meme facon */
      var overlay = document.getElementById('story-overlay');
      if (overlay && !overlay.classList.contains('active')) {
        var iframe = document.getElementById('iframe-view');
        if (iframe) iframe.innerHTML = '';
        var vue = document.getElementById('thumbnail-view');
        if (vue) vue.classList.remove('hidden');
        overlay.classList.add('active');
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', auChargement);
    } else {
      auChargement();
    }
    window.addEventListener('load', auChargement);
  })();
</script>
