<style data-purpose="custom-animations">
    /* Prevent scrolling on the body */
    html, body {
      overflow: hidden;
      background-color: #f2f4f8; /* Match image background */
      height: 100%;
    }

    @keyframes pulse-ripple { 0% { box-shadow: 0 0 0 0 rgba(124, 124, 255, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(124, 124, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(124, 124, 255, 0); } }

    /* ===== Mobile header search interaction ===== */
    #mobile-header {
      height: 64px;
    }

    /* The row of secondary icons (calendar / heart / location / cart / avatar) */
    #icon-row {
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
      opacity: 1;
      transform: translateX(0);
    }
    #icon-row.icons-hidden {
      opacity: 0;
      transform: translateX(8px);
      visibility: hidden;
      pointer-events: none;
      width: 0;
      overflow: hidden;
    }

    /* Collapsed search = small rounded-square button with just the icon (same size as sibling icon buttons) */
    #search-collapsed {
      flex-shrink: 0;
      transition: opacity 0.2s ease;
    }

    /* Expanded search = a single unified pill (one border, no internal seams) */
    #search-expanded {
      flex-grow: 1;
      display: flex;
      align-items: center;
      gap: 0;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-width 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease;
    }
    #mobile-header.search-active #search-expanded {
      max-width: 640px;
      opacity: 1;
    }
    #mobile-header.search-active #search-collapsed {
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }
    #mobile-header.search-active #header-spacer {
      flex-grow: 0;
      width: 8px;
    }

    #logo-area {
      transition: opacity 0.2s ease, width 0.2s ease;
    }
  </style></head>

<script data-purpose="interaction-logic">
  document.addEventListener('DOMContentLoaded', () => {
    const header = document.getElementById('mobile-header');
    const searchCollapsed = document.getElementById('search-collapsed');
    const searchClose = document.getElementById('btn-search-close');
    const searchInput = document.getElementById('search-input');
    const iconRow = document.getElementById('icon-row');

    const openSearch = () => {
      header.classList.add('search-active');
      iconRow.classList.add('icons-hidden');
      setTimeout(() => searchInput && searchInput.focus(), 150);
    };

    const closeSearch = () => {
      header.classList.remove('search-active');
      iconRow.classList.remove('icons-hidden');
      if (searchInput) searchInput.value = '';
    };

    if (searchCollapsed) searchCollapsed.addEventListener('click', openSearch);
    if (searchClose) searchClose.addEventListener('click', closeSearch);
  });
</script>
