<style data-purpose="custom-animations">
    /* Prevent scrolling on the body */
    body {
      overflow: hidden;
      /* background-color: var(--c-bg-alt, #fcf8ff); Match image background */
    }

    /* Initial states */
    #search-results-state {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.3s ease-out;
      display: none; /* Hidden initially */
    }

    #search-results-state.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      display: flex;
    }

    #initial-empty-state {
      transition: all 0.3s ease-out;
      opacity: 1;
      transform: translateY(0);
    }
    
    #initial-empty-state.hidden-state {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      position: absolute; /* Take out of flow when hidden to prevent layout shift */
      visibility: hidden;
    }
    
    #search-container {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes icon-pulse-ripple {

      100% { box-shadow: 0 0 0 0 rgba(124, 124, 255, 0); }
    }

      animation: icon-pulse-ripple 2s infinite;

<script data-purpose="interaction-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-input');
      const initialState = document.getElementById('initial-empty-state');
      const resultsState = document.getElementById('search-results-state');
      const viewAllLink = document.getElementById('view-all-link');
      const btnBack = document.getElementById('btn-back');
      const btnClose = document.getElementById('btn-close');

      // Scroll logic for indicators
      const scrollableList = document.getElementById('scrollable-service-list');
      const indicatorBars = document.querySelectorAll('.scroll-indicator-bar');
      
      if(scrollableList && indicatorBars.length > 0) {
        scrollableList.addEventListener('scroll', () => {
          const scrollPercent = scrollableList.scrollTop / (scrollableList.scrollHeight - scrollableList.clientHeight);
          const activeIndex = Math.min(
            indicatorBars.length - 1, 
            Math.max(0, Math.floor(scrollPercent * indicatorBars.length))
          );
          
          indicatorBars.forEach((bar, index) => {
            if(index === activeIndex) {
              bar.classList.add('active', 'opacity-100');
              bar.classList.remove('opacity-40');
            } else {
              bar.classList.remove('active', 'opacity-100');
              bar.classList.add('opacity-40');
            }
          });
        });
      }

      // Function to switch to 'results' view
      const activateSearch = () => {
        if(initialState) initialState.classList.add('hidden-state');
        if(resultsState) resultsState.classList.add('active');
      };

      // Function to reset to 'initial' view
      const resetSearch = () => {
        if(searchInput) searchInput.value = ''; // Clear input
        if(resultsState) resultsState.classList.remove('active');
        
        // Wait slightly for results to fade before showing initial state
        setTimeout(() => {
          if(initialState) initialState.classList.remove('hidden-state');
        }, 150);
      };

      // Event Listeners
      if(searchInput) searchInput.addEventListener('focus', activateSearch);
      if(btnBack) btnBack.addEventListener('click', resetSearch);
      if(btnClose) btnClose.addEventListener('click', resetSearch);
    });
  </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const carousels = document.querySelectorAll('.overflow-x-auto.snap-x');

  carousels.forEach(carousel => {
    let isDown = false;
    let startX;
    let scrollLeft;
    let isScrolling;

    // Use native smooth scrolling and snapping by default for better performance
    // The following JS is to allow mouse dragging which is not natively supported

    carousel.addEventListener('mousedown', (e) => {
      isDown = true;
      // Temporarily disable smooth scroll and snap for immediate drag response
      carousel.style.scrollBehavior = 'auto';
      carousel.classList.remove('snap-mandatory'); 
      startX = e.pageX - carousel.offsetLeft;
      scrollLeft = carousel.scrollLeft;
      carousel.style.cursor = 'grabbing';
      carousel.style.userSelect = 'none';
    });

    const endDrag = () => {
      if (!isDown) return;
      isDown = false;
      carousel.style.cursor = 'grab';
      carousel.style.userSelect = '';
      
      // Re-enable smooth scroll and snapping after a short delay
      // to let the momentum settle if any, then snap to nearest
      setTimeout(() => {
        carousel.style.scrollBehavior = 'smooth';
        carousel.classList.add('snap-mandatory');
      }, 50);
    };

    carousel.addEventListener('mouseleave', endDrag);
    carousel.addEventListener('mouseup', endDrag);

    carousel.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - carousel.offsetLeft;
      // Adjust drag speed here if needed
      const walk = (x - startX) * 1.5; 
      carousel.scrollLeft = scrollLeft - walk;
    });

    // We can rely on native wheel scrolling, but if we want horizontal scrolling with vertical wheel:
    carousel.addEventListener('wheel', (e) => {
      // Only hijack vertical scrolls to translate to horizontal if needed,
      // but native touchpads usually handle horizontal well.
      // If we do hijack, ensure smooth behavior.
      if (e.deltaY !== 0 && e.deltaX === 0) {
        e.preventDefault();
        carousel.scrollBy({
          left: e.deltaY < 0 ? -300 : 300, // Adjusted scroll amount
          behavior: 'smooth'
        });
      }
    }, { passive: false });

    // Initial cursor style
    carousel.style.cursor = 'grab';
  });
});
</script>
