<style data-purpose="custom-animations">
    /* Prevent scrolling on the body */
    body {
      overflow: hidden;
      background-color: #f2f4f8; /* Match image background */
    }

    /* Initial states */
    #search-results-state {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.3s ease-out;
      display: none; /* Hidden initially */
    }

    #search-results-state.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      display: flex;
    }

    #initial-empty-state {
      transition: all 0.3s ease-out;
      opacity: 1;
      transform: translateY(0);
    }
    
    #initial-empty-state.hidden-state {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      position: absolute; /* Take out of flow when hidden to prevent layout shift */
      visibility: hidden;
    }
    
    #search-container {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Accordion styles */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
      opacity: 0;
    }
    .accordion-content.expanded {
      max-height: 200px; /* Adjust as needed */
      opacity: 1;
    }
    .accordion-icon {
      transition: transform 0.3s ease;
    }
    .accordion-icon.rotated {
      transform: rotate(90deg);
    }

<script data-purpose="interaction-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-input');
      const initialState = document.getElementById('initial-empty-state');
      const resultsState = document.getElementById('search-results-state');
      const viewAllLink = document.getElementById('view-all-link');
      const btnBack = document.getElementById('btn-back');
      const btnClose = document.getElementById('btn-close');

      // Function to switch to 'results' view
      const activateSearch = () => {
        if(initialState && resultsState) {
          // Hide initial state immediately
          initialState.classList.add('hidden-state');
          
          // Show results state
          resultsState.classList.add('active');
        }
      };

      // Function to reset to 'initial' view
      const resetSearch = () => {
        if(searchInput) searchInput.value = ''; // Clear input
        
        if(initialState && resultsState) {
          // Hide results
          resultsState.classList.remove('active');
          
          // Wait slightly for results to fade before showing initial state
          setTimeout(() => {
            initialState.classList.remove('hidden-state');
          }, 150);
        }
      };

      // Event Listeners
      if(searchInput) searchInput.addEventListener('focus', activateSearch);
      
      // Buttons reset the state for this demo
      if(btnBack) btnBack.addEventListener('click', resetSearch);
      if(btnClose) btnClose.addEventListener('click', resetSearch);
      
      // Accordion Logic
      const accordionTrigger = document.getElementById('accordion-trigger');
      const accordionBody = document.getElementById('accordion-body');
      const accordionArrow = document.getElementById('accordion-arrow');
      const accordionSummary = document.getElementById('accordion-summary');
      
      if(accordionTrigger) {
        accordionTrigger.addEventListener('click', () => {
          const isExpanded = accordionBody.classList.contains('expanded');
          
          if(isExpanded) {
            accordionBody.classList.remove('expanded');
            accordionArrow.classList.remove('rotated');
            accordionSummary.classList.add('truncate');
          } else {
            accordionBody.classList.add('expanded');
            accordionArrow.classList.add('rotated');
            accordionSummary.classList.remove('truncate');
          }
        });
      }
    });
  </script>
