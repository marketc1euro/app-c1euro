<style data-purpose="custom-animations">
    /* Prevent scrolling on the body */
    body {
      overflow: hidden;
      background-color: var(--c-bg-alt, #fcf8ff); /* Match image background */
    }

    @keyframes icon-pulse-ripple {
      0% { box-shadow: 0 0 0 0 rgba(124, 124, 255, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(124, 124, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(124, 124, 255, 0); }
    }
    
    .animate-pulse-ripple {
      animation: icon-pulse-ripple 2s infinite;
    }

    /* Stack styles */
    .stack-container {
      position: relative;
      width: 300px;
      height: 400px;
      margin: 0 auto;
      perspective: 1000px;
    }
    
    @media (min-width: 768px) {
      .stack-container {
        width: 380px;
        height: 506px;
      }
    }

    .gallery-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      transform-origin: center center;
      cursor: pointer;
      border-radius: 1.5rem;
      overflow: hidden;
      background-color: #fff;
    }

    /* Custom Modern Slider */
    .modern-slider {
      -webkit-appearance: none;
      width: 4px;
      height: 140px;
      background: #e2e7ff;
      border-radius: 4px;
      outline: none;
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      transition: all 0.3s ease;
    }

    .modern-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #1a237e;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .modern-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);

<style id="c1euro-theme">
:root{
  --c-bg:#faf8ff; --c-card:#ffffff; --c-card-2:#f2f3ff; --c-elev:#e2e7ff;
  --c-line:#dae2fd; --c-line-2:#e2e7ff;
  --c-text:#131b2e; --c-text-2:#444748;
  /* variables dédiées aux couleurs écrites en style inline : la valeur par défaut
     est la couleur d'origine, au pixel près, pour que le mode clair ne bouge pas */
  --c-ink:rgb(0,0,0); --c-bg-alt:#fcf8ff; --c-bg-3:#f5f6fa;
  --c-grey-btn:rgb(206,214,224); --c-grey-2:rgb(241,242,246);
  --c-chip:rgb(226,239,254); --c-chip-2:rgba(211,228,254,.3); --c-chip-3:rgb(224,242,254);
  --c-overlay:rgba(255,255,255,.87); --c-overlay-2:rgba(255,255,255,.82);
  --c-white:#ffffff; --c-green-soft:#bbf7d0;
}
html.dark{
  --c-bg:#0d1117; --c-card:#141a24; --c-card-2:#1b2331; --c-elev:#1f2836;
  --c-line:transparent; --c-line-2:transparent;
  --c-text:#e8ebf3; --c-text-2:#9aa4b8;
  --c-ink:#e8ebf3; --c-bg-alt:#0d1117; --c-bg-3:#11161f;
  --c-grey-btn:#2b3346; --c-grey-2:rgba(255,255,255,.06);
  --c-chip:rgba(255,255,255,.06); --c-chip-2:rgba(255,255,255,.05); --c-chip-3:rgba(255,255,255,.06);
  --c-overlay:rgba(16,21,30,.92); --c-overlay-2:rgba(16,21,30,.86);
  --c-white:#141a24; --c-green-soft:rgba(52,211,153,.18);
}

html.theme-switching, html.theme-switching *{
  transition:background-color .35s ease, color .35s ease, border-color .35s ease,
             box-shadow .35s ease !important;
}

html.dark, html.dark body{background-color:var(--c-bg);}
html.dark body{color:var(--c-text);}
/* --- surfaces claires --- */
html.dark [class~="bg-white"]{background-color:var(--c-card);}
html.dark [class~="bg-white/90"]{background-color:rgba(20,26,36,.92);}
html.dark [class~="bg-white/70"]{background-color:rgba(20,26,36,.78);}
html.dark [class~="bg-white/50"]{background-color:rgba(20,26,36,.55);}
html.dark [class~="bg-white/20"]{background-color:rgba(255,255,255,.10);}
html.dark [class~="bg-white/10"]{background-color:rgba(255,255,255,.07);}
html.dark [class~="bg-white/5"]{background-color:rgba(255,255,255,.04);}
html.dark [class~="bg-[#fcf8ff]"], html.dark [class~="bg-[#faf8ff]"],
html.dark [class~="bg-[#f5f6fa]"], html.dark [class~="bg-[#f3f4f6]"],
html.dark [class~="bg-[#f1f2f6]"]{background-color:var(--c-bg);}
html.dark [class~="bg-[#f2f3ff]"], html.dark [class~="bg-[#E2EFFE]"],
html.dark [class~="bg-[#e2effe]"], html.dark [class~="bg-[#dbeafe]"]{background-color:var(--c-card-2);}
html.dark [class~="bg-[#d0e1fb]"], html.dark [class~="bg-[#d3e4fe]/30"]{background-color:rgba(124,140,255,.16);}
html.dark [class~="bg-[#ffedd5]"]{background-color:rgba(251,146,60,.18);}
html.dark [class~="bg-[#d2d9f4]"]{background-color:#1f2836;}
/* --- tokens du design system --- */
html.dark [class~="bg-surface"], html.dark [class~="bg-background"]{background-color:var(--c-bg);}
html.dark [class~="bg-surface-container-lowest"]{background-color:#10161e;}
html.dark [class~="bg-surface-container-low"]{background-color:var(--c-card);}
html.dark [class~="bg-surface-container-high"]{background-color:#1b2331;}
html.dark [class~="bg-surface-container-highest"]{background-color:#1f2836;}
html.dark [class~="bg-surface-container"]{background-color:#171e2a;}
html.dark [class~="bg-surface-container-low/80"]{background-color:rgba(20,26,36,.8);}
html.dark [class~="bg-surface-container-high/80"]{background-color:rgba(26,33,46,.8);}
html.dark [class~="bg-secondary-container"]{background-color:rgba(124,140,255,.18);}
html.dark [class~="bg-secondary-container/20"]{background-color:rgba(124,140,255,.10);}
html.dark [class~="bg-primary"]{background-color:#3546c9;}
html.dark [class~="bg-brand-pill"]{background-color:#5b6bf0;}
html.dark [class~="bg-brand-pill-count"]{background-color:#7c8cff;color:#0d1117;}
html.dark [class~="bg-on-surface"]{background-color:#080b11;}
html.dark [class~="bg-on-surface-variant/70"]{background-color:rgba(154,164,184,.45);}
html.dark [class~="bg-brand-bg"]{background-color:var(--c-bg);}
/* le noir pur tranche trop sur le fond : il rejoint la palette (boutons, cadres) */
html.dark [class~="bg-black"]{background-color:#1b2331;}
html.dark [class~="bg-[#000000]"]{background-color:#05070b;}
/* --- textes foncés --- */
html.dark [class~="text-black"], html.dark [class~="text-[#000000]"],
html.dark [class~="text-[#131b2e]"], html.dark [class~="text-[#1a1a1a]"],
html.dark [class~="text-gray-900"], html.dark [class~="text-gray-800"]{color:var(--c-text);}
html.dark [class~="text-[#444748]"], html.dark [class~="text-gray-700"],
html.dark [class~="text-gray-600"], html.dark [class~="text-gray-500"]{color:var(--c-text-2);}
html.dark [class~="text-on-surface"]{color:var(--c-text);}
html.dark [class~="text-on-surface-variant"]{color:var(--c-text-2);}
html.dark [class~="text-on-surface-variant/70"]{color:rgba(154,164,184,.78);}
html.dark [class~="text-brand-text"]{color:var(--c-text);}
html.dark [class~="text-primary"]{color:#9aa7ff;}
html.dark [class~="text-brand-pill"]{color:#a3aeff;}
html.dark [class~="text-on-secondary-container"]{color:#cfd7ff;}
html.dark [class~="text-on-secondary-fixed-variant"]{color:#c3cbe6;}
html.dark [class~="text-on-secondary-fixed"]{color:var(--c-text);}
html.dark [class~="text-surface"]{color:var(--c-text);}
html.dark [class~="placeholder-on-surface-variant/70"]::placeholder{color:rgba(154,164,184,.8);}
/* --- bordures : AUCUN contour clair ni gris en mode sombre ---
   Les bordures du design clair (blanches, gris-bleu) créaient des liserés et un
   effet de bloc. Elles deviennent transparentes : la hiérarchie se lit par les
   surfaces. Les séparateurs d'un seul côté reçoivent un creux sombre, invisible
   sur le fond mais qui détache deux surfaces voisines. */
html.dark [class~="border"], html.dark [class~="border-2"],
html.dark [class~="border-surface-container-high"],
html.dark [class~="border-surface-container-highest"],
html.dark [class~="border-surface-container-low"],
html.dark [class~="border-[#e2e7ff]"], html.dark [class~="border-[#dae2fd]"],
html.dark [class~="border-gray-100"], html.dark [class~="border-gray-200"],
html.dark [class~="border-black"], html.dark [class~="border-outline-variant"],
html.dark [class~="border-white"], html.dark [class~="border-white/50"],
html.dark [class~="border-white/30"], html.dark [class~="border-white/20"],
html.dark [class~="border-white/15"], html.dark [class~="border-white/10"],
html.dark [class~="border-white/5"]{border-color:transparent;}
/* séparateurs : creux sombre (plus sombre que les deux surfaces) */
html.dark [class~="border-b"], html.dark [class~="border-t"],
html.dark [class~="border-l"], html.dark [class~="border-r"]{border-color:#0a0e14;}
/* états porteurs de sens : on garde un accent indigo, jamais du gris */
html.dark [class~="border-brand-pill/30"]{border-color:rgba(124,140,255,.45);}
html.dark [class~="border-[#1a237e]"]{border-color:#5b6bf0;}
html.dark [class~="border-error"], html.dark [class~="focus:border-error"]{border-color:#e5484d;}
/* fonds gris et opaques restants */
html.dark [class~="bg-white/80"]{background-color:rgba(20,26,36,.85);}
html.dark [class~="bg-white/95"]{background-color:rgba(20,26,36,.95);}
html.dark [class~="bg-gray-100"]{background-color:#1a212e;}
html.dark [class~="bg-gray-200"]{background-color:#222939;}
html.dark [class~="bg-gray-300"]{background-color:#2b3346;}
html.dark [class~="text-gray-400"]{color:#7d8798;}
/* styles écrits dans les pages elles-mêmes (galerie, panneaux de la carte) */
html.dark .gallery-item{background-color:var(--c-card);}
html.dark #bottom-panel.youtube-active, html.dark #bottom-panel.campaign-active,
html.dark #bottom-panel.product-active{background-color:var(--c-card);}
html.dark .play-button-overlay{background-color:rgba(20,26,36,.72);}
html.dark .play-button-overlay:hover{background-color:rgba(20,26,36,.9);}
html.dark .play-icon{border-left-color:#e8ebf3;}
/* carte : fond sombre lisible (les tuiles claires sont inversées), contrôles assortis */
html.dark .leaflet-container{background-color:#0d1117!important;}
html.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9);}
html.dark .leaflet-control-attribution{background:rgba(20,26,36,.85)!important;color:#9aa4b8!important;}
html.dark .leaflet-control-attribution a{color:#9aa7ff!important;}
html.dark .leaflet-bar a{background-color:#141a24!important;color:#e8ebf3!important;border-color:transparent!important;}
html.dark .leaflet-bar a:hover{background-color:#1a212e!important;}
/* accents colorés : on garde la teinte, en version translucide, avec du texte clair */
html.dark [style*="rgb(255, 158, 158)"]{background-color:rgba(255,158,158,.20)!important;}
html.dark [style*="rgb(243, 156, 18)"]{background-color:rgba(243,156,18,.22)!important;}
html.dark [style*="rgb(255, 250, 101)"]{background-color:rgba(255,250,101,.20)!important;}
html.dark [style*="rgb(231, 127, 103)"]{background-color:rgba(231,127,103,.22)!important;}
html.dark [style*="rgb(64, 64, 122)"]{background-color:rgba(120,130,255,.22)!important;}
html.dark [style*="rgb(59, 130, 246)"]{background-color:rgba(59,130,246,.25)!important;}
html.dark [style*="rgb(139, 92, 246)"]{background-color:rgba(139,92,246,.25)!important;}
html.dark [style*="rgb(236, 72, 153)"]{background-color:rgba(236,72,153,.25)!important;}
html.dark [style*="rgb(239, 68, 68)"]{background-color:rgba(239,68,68,.25)!important;}
html.dark [class~="bg-[#D4AF37]"]{background-color:rgba(212,175,55,.24);}
html.dark [class~="bg-[#B2FF59]"]{background-color:rgba(178,255,89,.20);}
html.dark [class~="bg-[#00a8e8]"]{background-color:rgba(0,168,232,.25);}
html.dark [class~="bg-[#ff6b6b]"]{background-color:rgba(255,107,107,.25);}
html.dark [class~="bg-[#7f9f5a]"]{background-color:rgba(127,159,90,.25);}
html.dark [class~="bg-[#d97b84]"]{background-color:rgba(217,123,132,.28);}
/* champs de saisie : le blanc est le fond par défaut du navigateur */
html.dark input, html.dark textarea, html.dark select{
  background-color:var(--c-card); color:var(--c-text); border-color:transparent;
}
html.dark input::placeholder, html.dark textarea::placeholder{color:rgba(154,164,184,.8);}
/* logo : éclairci pour rester lisible sur fond sombre */
html.dark img[alt="C1EURO Logo"], html.dark img[alt="C1EURO Icon"]{filter:brightness(1.55) saturate(1.05);}

/* --- nouvel interrupteur de thème (pied de page) --- */
.theme-switch{border-radius:9999px!important;}
.theme-switch .theme-track{border-radius:9999px!important;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.02));}
.theme-knob{border-radius:9999px!important;transition:transform .55s cubic-bezier(.34,1.56,.64,1), background-color .45s ease, color .45s ease;}
html.dark .theme-knob{transform:translateX(42px);background:#0d1117;color:#e8ebf3;}
html.dark .theme-switch{border-color:rgba(124,140,255,.40);background-color:rgba(124,140,255,.14);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45), 0 10px 30px -14px rgba(124,140,255,.7);}
html.dark .theme-hint{color:rgba(255,255,255,.75);}
</style>

<script data-purpose="interaction-logic">
  document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('gallery-container');
    const zoomSlider = document.getElementById('zoom-slider');
    let items = Array.from(document.querySelectorAll('.gallery-item'));
    
    let isAnimating = false;

    // Apply zoom to the currently top image
    function applyZoom() {
        const topItemImg = container.querySelector('.gallery-item[style*="z-index: 5"] img') || items[0].querySelector('img');
        if(topItemImg) {
            topItemImg.style.transform = `scale(${zoomSlider.value})`;
        }
    }

    // Reset zoom for all images except potentially the top one
    function resetZoomForOthers() {
       items.forEach((item) => {
           if(item.style.zIndex !== '5') {
               const img = item.querySelector('img');
               if(img) img.style.transform = 'scale(1)';
           }
       });
    }

    zoomSlider.addEventListener('input', applyZoom);

    function updateCards() {
      items.forEach((item, index) => {
        item.style.zIndex = items.length - index;
        if (index === 0) {
          item.style.transform = 'translateY(0) scale(1) rotate(0deg)';
          item.style.opacity = '1';
        } else if (index === 1) {
          item.style.transform = 'translateY(20px) translateX(25px) scale(0.95) rotate(5deg)';
          item.style.opacity = '0.9';
        } else if (index === 2) {
          item.style.transform = 'translateY(-10px) translateX(-25px) scale(0.90) rotate(-5deg)';
          item.style.opacity = '0.8';
        } else {
          item.style.transform = 'translateY(40px) scale(0.85)';
          item.style.opacity = '0';
        }
      });
      // Maintain zoom level on the new top card
      applyZoom();
      resetZoomForOthers();
    }

    function nextCard() {
      if (isAnimating || items.length <= 1) return;
      isAnimating = true;
      
      const first = items.shift();
      
      // Move current top card out of the way
      first.style.transform = 'translateY(-150px) scale(1.05)';
      first.style.opacity = '0';
      
      // Reset zoom on the card moving away
      const firstImg = first.querySelector('img');
      if(firstImg) firstImg.style.transform = 'scale(1)';
      
      setTimeout(() => {
        items.push(first);
        updateCards();
        setTimeout(() => {
          isAnimating = false;
        }, 500);
      }, 300);
    }

    container.addEventListener('click', () => {
      nextCard();
    });

    let touchStartY = 0;
    container.addEventListener('touchstart', (e) => {
      touchStartY = e.changedTouches[0].screenY;
    });

    container.addEventListener('touchend', (e) => {
      const touchEndY = e.changedTouches[0].screenY;
      if (touchStartY - touchEndY > 50 || touchEndY - touchStartY > 50) {
        nextCard();
      }
    });

    container.addEventListener('wheel', (e) => {
      if (e.deltaY > 0 || e.deltaY < 0) {
        nextCard();
      }
    });

    // Initial positioning
    updateCards();
  });
</script>
